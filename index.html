<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساعد العلوم</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8ff;
      text-align: center;
      padding: 25px;
      color: #222;
    }

    .box {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px #ccc;
    }

    h1 {
      font-size: 36px;
    }

    h2 {
      color: #2463eb;
    }

    .intro {
      font-size: 18px;
      line-height: 1.8;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      margin: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    #start {
      background: #2463eb;
      color: white;
    }

    .answer {
      background: #e8eefc;
      display: block;
      width: 90%;
      margin: 10px auto;
    }

    .next {
      background: #2463eb;
      color: white;
    }

    #lesson {
      display: none;
    }

    #result {
      font-size: 22px;
      font-weight: bold;
      margin: 20px;
    }

    #score {
      font-size: 30px;
      color: #2463eb;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🔬 مساعد العلوم</h1>

    <h2>الصف الخامس الابتدائي</h2>

    <p class="intro">
      أنا صديقكم فيصل الزامل، وأحب مادة العلوم،
      لذلك قمت بعمل هذا الموقع. 🔬❤️
    </p>

    <h2>الدرس الحالي</h2>

    <p>🌱 تصنيف المخلوقات الحية</p>

    <button id="start" onclick="startLesson()">
      🚀 ابدأ الدرس
    </button>

    <div id="lesson">

      <hr>

      <h2 id="questionNumber"></h2>

      <h3 id="question"></h3>

      <div id="answers"></div>

      <div id="result"></div>

      <button class="next" id="nextButton" onclick="nextQuestion()" style="display:none;">
        ➡️ السؤال التالي
      </button>

    </div>

  </div>

  <script>

    const questions = [
      {
        question: "أي مما يلي يُعد مخلوقًا حيًا؟",
        answers: ["🪨 الصخرة", "🌳 الشجرة", "🪑 الكرسي"],
        correct: 1
      },
      {
        question: "لماذا يصنف العلماء المخلوقات الحية؟",
        answers: [
          "🔍 لتسهيل دراستها",
          "🎨 لتغيير ألوانها",
          "📏 لزيادة حجمها"
        ],
        correct: 0
      },
      {
        question: "أي مما يلي من المخلوقات الحية؟",
        answers: [
          "🐶 الكلب",
          "🚗 السيارة",
          "🏠 المنزل"
        ],
        correct: 0
      },
      {
        question: "أي مخلوق من التالي يصنع غذاءه بنفسه؟",
        answers: [
          "🌱 النبات",
          "🐱 القط",
          "🐟 السمكة"
        ],
        correct: 0
      },
      {
        question: "يعتمد التصنيف على الصفات المشتركة بين المخلوقات الحية.",
        answers: [
          "✅ صح",
          "❌ خطأ"
        ],
        correct: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function startLesson() {
      document.getElementById("start").style.display = "none";
      document.getElementById("lesson").style.display = "block";

      showQuestion();
    }

    function showQuestion() {

      answered = false;

      document.getElementById("result").innerHTML = "";

      document.getElementById("nextButton").style.display = "none";

      document.getElementById("questionNumber").innerHTML =
        "السؤال " + (currentQuestion + 1) + " من " + questions.length;

      document.getElementById("question").innerHTML =
        questions[currentQuestion].question;

      const answersDiv = document.getElementById("answers");

      answersDiv.innerHTML = "";

      questions[currentQuestion].answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.className = "answer";

        button.innerHTML = answer;

        button.onclick = function() {
          checkAnswer(index);
        };

        answersDiv.appendChild(button);

      });
    }

    function checkAnswer(selected) {

      if (answered) {
        return;
      }

      answered = true;

      const correct = questions[currentQuestion].correct;

      const result = document.getElementById("result");

      if (selected === correct) {

        score++;

        result.innerHTML = "🎉 أحسنت! إجابة صحيحة.";

      } else {

        result.innerHTML =
          "❌ إجابة غير صحيحة. حاول تتذكر المعلومة مرة أخرى.";

      }

      document.getElementById("nextButton").style.display = "inline-block";
    }

    function nextQuestion() {

      currentQuestion++;

      if (currentQuestion < questions.length) {

        showQuestion();

      } else {

        showFinalResult();

      }
    }

    function showFinalResult() {

      document.getElementById("questionNumber").innerHTML =
        "🏆 انتهى الاختبار!";

      document.getElementById("question").innerHTML =
        "أحسنت على إكمال الاختبار 🎉";

      document.getElementById("answers").innerHTML = "";

      document.getElementById("result").innerHTML =
        "<div id='score'>" + score + " / " + questions.length + "</div>" +
        "<br>⭐ هذه هي نتيجتك";

      document.getElementById("nextButton").innerHTML =
        "🔄 إعادة الاختبار";

      document.getElementById("nextButton").style.display = "inline-block";

      document.getElementById("nextButton").onclick = function() {

        currentQuestion = 0;
        score = 0;

        showQuestion();

      };

    }

  </script>

</body>
</html>
